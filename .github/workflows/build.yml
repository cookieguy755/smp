name: Build GemsSMP
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        run: mvn -B clean package
      - name: Flatten jar
        run: cp target/GemsSMP-*.jar GemsSMP.jar
      - uses: actions/upload-artifact@v4
        with:
          name: GemsSMP-jar
          path: GemsSMP.jar
